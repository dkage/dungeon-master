<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    main { padding: 0 16px; max-width: 32rem; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Dungeon</h1>
    <p>The server is running. The cockpit is not built yet.</p>
    <p id="status"><code>checking /api/health…</code></p>
  </main>
  <script>
    fetch('/api/health', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { document.getElementById('status').textContent = 'API ok, version ' + j.version; })
      .catch(e => { document.getElementById('status').textContent = 'API unreachable (' + e + '). Open the URL printed by the server, including ?token=…'; });
  </script>
</body>
</html>
